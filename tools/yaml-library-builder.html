<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Library YAML Builder</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101014;
      --panel: #18181f;
      --panel-2: #202029;
      --line: #343441;
      --text: #f4f1ed;
      --muted: #aaa6b1;
      --accent: #ef7da8;
      --accent-2: #f3b66e;
      --danger: #ef6f75;
      --good: #72d3a1;
      --radius: 14px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% -10%, rgba(239, 125, 168, .12), transparent 34rem),
        radial-gradient(circle at 90% 0%, rgba(243, 182, 110, .08), transparent 30rem),
        var(--bg);
      color: var(--text);
    }

    button, input, textarea { font: inherit; }

    button {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel-2);
      color: var(--text);
      padding: .58rem .78rem;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #21131a; font-weight: 750; }
    button.danger { color: #ffd8da; border-color: rgba(239, 111, 117, .55); }
    button.ghost { background: transparent; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.15rem 1.4rem;
      border-bottom: 1px solid var(--line);
      background: rgba(16, 16, 20, .86);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    h1 { font-size: 1.12rem; margin: 0; letter-spacing: .01em; }
    .subtitle { color: var(--muted); font-size: .82rem; margin-top: .18rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: flex-end; }
    #fileInput { display: none; }

    main {
      display: grid;
      grid-template-columns: minmax(240px, .78fr) minmax(320px, 1.05fr) minmax(360px, 1.3fr);
      gap: 1rem;
      padding: 1rem;
      min-height: calc(100vh - 79px);
    }

    .panel {
      background: rgba(24, 24, 31, .94);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .6rem;
      padding: .88rem 1rem;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 { font-size: .86rem; text-transform: uppercase; letter-spacing: .09em; margin: 0; color: var(--muted); }
    .panel-body { padding: 1rem; overflow: auto; }

    .tree-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: .4rem; margin-bottom: .85rem; }
    .tree-actions button { padding: .48rem .3rem; font-size: .8rem; }
    .tree { display: grid; gap: .25rem; }
    .tree-row {
      width: 100%;
      text-align: left;
      border-color: transparent;
      background: transparent;
      padding: .48rem .6rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tree-row:hover { background: var(--panel-2); color: var(--text); }
    .tree-row.active { color: var(--text); background: rgba(239, 125, 168, .14); border-color: rgba(239, 125, 168, .38); }
    .tree-row.category { font-weight: 750; color: var(--text); }
    .tree-row.subcategory { padding-left: 1.4rem; }
    .tree-row.preset { padding-left: 2.25rem; }
    .tree-row .key { color: var(--muted); font-weight: 400; font-size: .75rem; }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 11px;
      padding: 1rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .editor-grid { display: grid; gap: .9rem; }
    label { display: grid; gap: .38rem; color: var(--muted); font-size: .8rem; font-weight: 650; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #111117;
      color: var(--text);
      padding: .7rem .75rem;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(239, 125, 168, .12); }
    textarea { resize: vertical; min-height: 8rem; line-height: 1.45; }
    #yamlOutput { flex: 1; min-height: 28rem; resize: none; border: 0; border-radius: 0; padding: 1rem; font: 12.5px/1.55 "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
    .hint { color: var(--muted); font-size: .76rem; line-height: 1.45; }
    .editor-footer { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: .2rem; }

    .status {
      padding: .68rem 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .78rem;
    }
    .status.good { color: var(--good); }
    .status.bad { color: #ffb8bc; }
    .privacy { color: var(--muted); font-size: .72rem; }

    @media (max-width: 1050px) {
      main { grid-template-columns: minmax(220px, .8fr) minmax(340px, 1.2fr); }
      .preview-panel { grid-column: 1 / -1; min-height: 34rem; }
    }

    @media (max-width: 700px) {
      header { align-items: flex-start; flex-direction: column; position: static; }
      .actions { justify-content: flex-start; }
      main { grid-template-columns: 1fr; }
      .preview-panel { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Prompt Library YAML Builder</h1>
      <div class="subtitle">Build, validate, and download your ComfyUI prompt library.</div>
    </div>
    <div class="actions">
      <button id="newButton" class="ghost">New library</button>
      <button id="importButton">Import YAML</button>
      <input id="fileInput" type="file" accept=".yml,.yaml,text/yaml">
      <button id="copyButton">Copy YAML</button>
      <button id="downloadButton" class="primary">Download YAML</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head"><h2>Library</h2><span class="privacy">Saved only in this browser</span></div>
      <div class="panel-body">
        <div class="tree-actions">
          <button id="addCategory">+ Category</button>
          <button id="addSubcategory">+ Subcategory</button>
          <button id="addPreset">+ Preset</button>
        </div>
        <nav id="tree" class="tree" aria-label="Prompt library hierarchy"></nav>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2 id="editorTitle">Editor</h2></div>
      <div id="editor" class="panel-body"></div>
    </section>

    <section class="panel preview-panel">
      <div class="panel-head"><h2>Generated YAML</h2><span id="entryCount" class="privacy"></span></div>
      <textarea id="yamlOutput" readonly spellcheck="false" aria-label="Generated YAML"></textarea>
      <div id="status" class="status">Ready.</div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "prompt-library-yaml-builder-v1";
    const makeId = () => crypto.randomUUID?.() ?? `${Date.now()}-${Math.random()}`;
    const slugify = (value) => String(value ?? "")
      .trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
    const splitTags = (value) => String(value ?? "").split(",").map((tag) => tag.trim()).filter(Boolean);
    const quote = (value) => JSON.stringify(String(value ?? ""));
    const keyLine = (key) => /^[a-zA-Z_][a-zA-Z0-9_-]*$/.test(key) ? key : quote(key);
    const indentPrompt = (value, spaces) => {
      const pad = " ".repeat(spaces);
      const text = String(value ?? "").replace(/\r\n/g, "\n");
      return (text || "").split("\n").map((line) => `${pad}${line}`).join("\n");
    };
    const tagYaml = (tags) => `[${tags.map(quote).join(", ")}]`;

    let state = loadState();
    let selection = firstSelection(state);

    function blankState() {
      return { version: 1, categories: [] };
    }

    function firstSelection(data) {
      const category = data.categories[0];
      const subcategory = category?.subcategories?.[0];
      const preset = subcategory?.presets?.[0];
      if (preset) return { type: "preset", id: preset.id };
      if (subcategory) return { type: "subcategory", id: subcategory.id };
      if (category) return { type: "category", id: category.id };
      return null;
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved?.version === 1 && Array.isArray(saved.categories)) return saved;
      } catch (error) {
        console.warn("Unable to restore builder state", error);
      }
      return blankState();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function findSelected() {
      if (!selection) return null;
      for (const category of state.categories) {
        if (selection.type === "category" && category.id === selection.id) return { item: category, category };
        for (const subcategory of category.subcategories) {
          if (selection.type === "subcategory" && subcategory.id === selection.id) return { item: subcategory, category, subcategory };
          for (const preset of subcategory.presets) {
            if (selection.type === "preset" && preset.id === selection.id) return { item: preset, category, subcategory, preset };
          }
        }
      }
      return null;
    }

    function newCategory(label = "New Category") {
      return { id: makeId(), key: slugify(label), label, tags: [], subcategories: [] };
    }

    function newSubcategory(label = "New Subcategory") {
      return { id: makeId(), key: slugify(label), label, tags: [], presets: [] };
    }

    function newPreset(label = "New Preset") {
      return { id: makeId(), key: slugify(label), label, tags: [], prompt: "" };
    }

    function render() {
      saveState();
      renderTree();
      renderEditor();
      const yaml = generateYaml();
      document.querySelector("#yamlOutput").value = yaml;
      const errors = validate();
      const status = document.querySelector("#status");
      status.className = `status ${errors.length ? "bad" : "good"}`;
      status.textContent = errors.length ? errors.join(" • ") : "Valid library schema — ready to download.";
      const presetCount = state.categories.reduce((sum, category) => sum + category.subcategories.reduce((inner, subcategory) => inner + subcategory.presets.length, 0), 0);
      document.querySelector("#entryCount").textContent = `${state.categories.length} categories · ${presetCount} presets`;
    }

    function renderTree() {
      const tree = document.querySelector("#tree");
      tree.replaceChildren();
      if (!state.categories.length) {
        tree.innerHTML = '<div class="empty">Start with a category, or import your existing <code>prompt_library.yml</code>.</div>';
        return;
      }

      for (const category of state.categories) {
        tree.append(treeButton(category, "category"));
        for (const subcategory of category.subcategories) {
          tree.append(treeButton(subcategory, "subcategory"));
          for (const preset of subcategory.presets) tree.append(treeButton(preset, "preset"));
        }
      }
    }

    function treeButton(item, type) {
      const button = document.createElement("button");
      button.className = `tree-row ${type}${selection?.id === item.id ? " active" : ""}`;
      button.innerHTML = `${escapeHtml(item.label || "Untitled")} <span class="key">${escapeHtml(item.key || "missing-key")}</span>`;
      button.addEventListener("click", () => { selection = { type, id: item.id }; render(); });
      return button;
    }

    function renderEditor() {
      const editor = document.querySelector("#editor");
      const title = document.querySelector("#editorTitle");
      const found = findSelected();
      editor.replaceChildren();
      if (!found) {
        title.textContent = "Editor";
        editor.innerHTML = '<div class="empty">Select an entry from the library tree to edit it.</div>';
        return;
      }

      title.textContent = `Edit ${selection.type}`;
      const form = document.createElement("div");
      form.className = "editor-grid";
      form.append(field("Friendly label", "label", found.item.label));
      form.append(field("Stable key", "key", found.item.key));
      form.append(field("Tags", "tags", found.item.tags.join(", "), "Comma-separated; tags are metadata and do not enter the prompt."));
      if (selection.type === "preset") {
        form.append(field("Prompt", "prompt", found.item.prompt, "The full multiline text emitted by the selector.", true));
      }

      const footer = document.createElement("div");
      footer.className = "editor-footer";
      footer.innerHTML = '<span class="hint">Changes update the YAML immediately.</span>';
      const remove = document.createElement("button");
      remove.className = "danger";
      remove.textContent = `Delete ${selection.type}`;
      remove.addEventListener("click", deleteSelected);
      footer.append(remove);
      form.append(footer);
      editor.append(form);
    }

    function field(labelText, property, value, hint = "", multiline = false) {
      const label = document.createElement("label");
      label.textContent = labelText;
      const input = document.createElement(multiline ? "textarea" : "input");
      input.value = value ?? "";
      if (multiline) input.rows = 14;
      input.addEventListener("input", () => {
        const found = findSelected();
        if (!found) return;
        found.item[property] = property === "tags" ? splitTags(input.value) : input.value;
        renderWithoutEditor();
      });
      label.append(input);
      if (hint) {
        const help = document.createElement("span");
        help.className = "hint";
        help.textContent = hint;
        label.append(help);
      }
      return label;
    }

    function renderWithoutEditor() {
      saveState();
      renderTree();
      document.querySelector("#yamlOutput").value = generateYaml();
      const errors = validate();
      const status = document.querySelector("#status");
      status.className = `status ${errors.length ? "bad" : "good"}`;
      status.textContent = errors.length ? errors.join(" • ") : "Valid library schema — ready to download.";
    }

    function addCategory() {
      const item = newCategory();
      state.categories.push(item);
      selection = { type: "category", id: item.id };
      render();
    }

    function addSubcategory() {
      let found = findSelected();
      let category = found?.category;
      if (!category) {
        category = newCategory();
        state.categories.push(category);
      }
      const item = newSubcategory();
      category.subcategories.push(item);
      selection = { type: "subcategory", id: item.id };
      render();
    }

    function addPreset() {
      let found = findSelected();
      let category = found?.category;
      if (!category) {
        category = newCategory();
        state.categories.push(category);
      }
      let subcategory = found?.subcategory;
      if (!subcategory) {
        subcategory = newSubcategory();
        category.subcategories.push(subcategory);
      }
      const item = newPreset();
      subcategory.presets.push(item);
      selection = { type: "preset", id: item.id };
      render();
    }

    function deleteSelected() {
      const found = findSelected();
      if (!found || !confirm(`Delete “${found.item.label || found.item.key}” and anything inside it?`)) return;
      if (selection.type === "category") state.categories = state.categories.filter((item) => item.id !== selection.id);
      if (selection.type === "subcategory") found.category.subcategories = found.category.subcategories.filter((item) => item.id !== selection.id);
      if (selection.type === "preset") found.subcategory.presets = found.subcategory.presets.filter((item) => item.id !== selection.id);
      selection = firstSelection(state);
      render();
    }

    function validate() {
      const errors = [];
      const checkGroup = (items, context) => {
        const seen = new Set();
        for (const item of items) {
          if (!item.key.trim()) errors.push(`${context} contains an empty key`);
          if (item.key && !/^[a-zA-Z_][a-zA-Z0-9_-]*$/.test(item.key)) errors.push(`Key “${item.key}” must use letters, numbers, underscores, or hyphens`);
          if (!item.label.trim()) errors.push(`${item.key || context} has no label`);
          if (seen.has(item.key)) errors.push(`Duplicate key “${item.key}” in ${context}`);
          seen.add(item.key);
        }
      };
      checkGroup(state.categories, "categories");
      for (const category of state.categories) {
        checkGroup(category.subcategories, category.key || "category");
        for (const subcategory of category.subcategories) checkGroup(subcategory.presets, subcategory.key || "subcategory");
      }
      return [...new Set(errors)];
    }

    function generateYaml() {
      const lines = ["version: 1", "", "categories:"];
      if (!state.categories.length) return `${lines.join("\n")} {}`.replace("categories: {}", "categories: {}") + "\n";
      for (const category of state.categories) {
        lines.push(`  ${keyLine(category.key)}:`, `    label: ${quote(category.label)}`);
        if (category.tags.length) lines.push("    metadata:", `      tags: ${tagYaml(category.tags)}`);
        lines.push("    subcategories:");
        if (!category.subcategories.length) lines.push("      {}");
        for (const subcategory of category.subcategories) {
          lines.push(`      ${keyLine(subcategory.key)}:`, `        label: ${quote(subcategory.label)}`);
          if (subcategory.tags.length) lines.push("        metadata:", `          tags: ${tagYaml(subcategory.tags)}`);
          lines.push("        presets:");
          if (!subcategory.presets.length) lines.push("          {}");
          for (const preset of subcategory.presets) {
            lines.push(`          ${keyLine(preset.key)}:`, `            label: ${quote(preset.label)}`, "            prompt: |-", indentPrompt(preset.prompt, 14));
            if (preset.tags.length) lines.push("            metadata:", `              tags: ${tagYaml(preset.tags)}`);
          }
        }
      }
      return `${lines.join("\n")}\n`;
    }

    function parseYaml(source) {
      const data = blankState();
      const lines = source.replace(/\r\n/g, "\n").split("\n");
      let category = null;
      let subcategory = null;
      let preset = null;
      let promptIndent = null;
      let promptLines = [];

      const finishPrompt = () => {
        if (!preset || promptIndent == null) return;
        preset.prompt = promptLines.join("\n").replace(/\n+$/, "");
        promptIndent = null;
        promptLines = [];
      };

      for (let index = 0; index < lines.length; index += 1) {
        const raw = lines[index];
        const indent = raw.match(/^ */)[0].length;
        const text = raw.trim();
        if (promptIndent != null) {
          if (!text || indent >= promptIndent) {
            promptLines.push(!text ? "" : raw.slice(promptIndent));
            continue;
          }
          finishPrompt();
        }
        if (!text || text.startsWith("#") || text === "categories:" || text.startsWith("version:")) continue;

        const keyMatch = text.match(/^([A-Za-z_][A-Za-z0-9_-]*):$/);
        if (indent === 2 && keyMatch) {
          category = newCategory(keyMatch[1]);
          category.key = keyMatch[1];
          data.categories.push(category);
          subcategory = preset = null;
          continue;
        }
        if (indent === 6 && keyMatch && category) {
          subcategory = newSubcategory(keyMatch[1]);
          subcategory.key = keyMatch[1];
          category.subcategories.push(subcategory);
          preset = null;
          continue;
        }
        if (indent === 10 && keyMatch && subcategory) {
          preset = newPreset(keyMatch[1]);
          preset.key = keyMatch[1];
          subcategory.presets.push(preset);
          continue;
        }

        const valueMatch = text.match(/^(label|tags):\s*(.*)$/);
        if (valueMatch) {
          const value = parseScalar(valueMatch[2]);
          if (valueMatch[1] === "label") {
            if (indent === 4 && category) category.label = value;
            if (indent === 8 && subcategory) subcategory.label = value;
            if (indent === 12 && preset) preset.label = value;
          } else {
            const tags = parseTags(valueMatch[2]);
            if (indent === 6 && category) category.tags = tags;
            if (indent === 10 && subcategory) subcategory.tags = tags;
            if (indent === 14 && preset) preset.tags = tags;
          }
          continue;
        }

        if (indent === 12 && /^prompt:\s*[>|]/.test(text) && preset) {
          promptIndent = 14;
          promptLines = [];
        }
      }
      finishPrompt();
      if (!data.categories.length) throw new Error("No categories were found. Import a prompt library using the documented schema.");
      return data;
    }

    function parseScalar(value) {
      const trimmed = value.trim();
      if (trimmed.startsWith('"') && trimmed.endsWith('"')) {
        try { return JSON.parse(trimmed); } catch { return trimmed.slice(1, -1); }
      }
      return trimmed.replace(/^['"]|['"]$/g, "");
    }

    function parseTags(value) {
      const trimmed = value.trim().replace(/^\[/, "").replace(/\]$/, "");
      return trimmed ? trimmed.split(",").map(parseScalar).map((tag) => tag.trim()).filter(Boolean) : [];
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[character]);
    }

    document.querySelector("#addCategory").addEventListener("click", addCategory);
    document.querySelector("#addSubcategory").addEventListener("click", addSubcategory);
    document.querySelector("#addPreset").addEventListener("click", addPreset);
    document.querySelector("#newButton").addEventListener("click", () => {
      if (!confirm("Start a new library? Your current builder state will be replaced.")) return;
      state = blankState(); selection = null; render();
    });
    document.querySelector("#importButton").addEventListener("click", () => document.querySelector("#fileInput").click());
    document.querySelector("#fileInput").addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        state = parseYaml(await file.text());
        selection = firstSelection(state);
        render();
      } catch (error) {
        const status = document.querySelector("#status");
        status.className = "status bad";
        status.textContent = `Import failed: ${error.message}`;
      } finally {
        event.target.value = "";
      }
    });
    document.querySelector("#copyButton").addEventListener("click", async () => {
      await navigator.clipboard.writeText(generateYaml());
      const status = document.querySelector("#status");
      status.className = "status good";
      status.textContent = "YAML copied to the clipboard.";
    });
    document.querySelector("#downloadButton").addEventListener("click", () => {
      const errors = validate();
      if (errors.length) return alert(`Fix these issues before downloading:\n\n${errors.join("\n")}`);
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([generateYaml()], { type: "text/yaml" }));
      link.download = "prompt_library.yml";
      link.click();
      URL.revokeObjectURL(link.href);
    });

    render();
  </script>
</body>
</html>
